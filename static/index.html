<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>koebiten wasm</title>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sago35.github.io/koebiten/">
    <meta property="og:title" content="koebiten wasm">
    <meta property="og:description" content="Koebiten is a 2D game engine that runs on TinyGo. It’s inspired by Ebitengine and is characterized by its simple API.">
    <meta property="og:image" content="https://sago35.github.io/koebiten/ogp.png">
    <meta property="og:site_name" content="koebiten wasm">
    <meta property="og:locale" content="ja_JP">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@sago35tk">
    <meta name="twitter:title" content="koebiten wasm">
    <meta name="twitter:description" content="Koebiten is a 2D game engine that runs on TinyGo. It’s inspired by Ebitengine and is characterized by its simple API.">
    <meta name="twitter:image" content="https://sago35.github.io/koebiten/ogp.png">

    <script src="wasm_exec.js"></script>
    <script type="module" src="main.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 10px;
        }

        .screen-container {
            display: inline-block;
            margin-bottom: 20px;
        }

        .description {
            font-size: 14px;
            color: #444;
            padding: 15px;
            background-color: #ffffff;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            line-height: 1.6;
            text-align: left;
        }

        .description table {
            width: 100%;
            border-collapse: collapse;
        }

        .description th {
            text-align: right;
            padding-right: 10px;
            color: #333;
        }

        .description td {
            text-align: left;
        }

        canvas {
            border: 1px solid #ccc;
            background-color: #000;
            image-rendering: pixelated;
            max-width: 100%;
            height: auto;
        }

        .screen-container,
        .screen-container > div {
            max-width: 100%;
            box-sizing: border-box;
        }

        .key {
            display: inline-block;
            padding: 3px 6px;
            margin: 2px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            background-color: #e0e0e0;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            font-family: monospace;
        }

        .github-link {
            margin-top: 20px;
            display: inline-block;
        }

        .github-link svg {
            width: 32px;
            height: 32px;
            fill: #333;
            transition: fill 0.3s;
        }

        .github-link:hover svg {
            fill: #0366d6;
        }

        .gopher-credit {
            font-size: 10px;
            color: #999;
            margin-top: 10px;
        }

        .touch-controls {
            display: none;
            justify-content: space-between;
            align-items: center;
            max-width: 420px;
            box-sizing: border-box;
            margin: 12px auto 0;
            padding: 0 16px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body.touch .touch-controls {
            display: flex;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 54px);
            grid-template-rows: repeat(3, 54px);
            gap: 3px;
        }

        .dpad .up    { grid-area: 1 / 2; }
        .dpad .left  { grid-area: 2 / 1; }
        .dpad .right { grid-area: 2 / 3; }
        .dpad .down  { grid-area: 3 / 2; }

        .pad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
            color: #333;
            background-color: #e0e0e0;
            border: 1px solid #aaa;
            border-radius: 8px;
            box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.25);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }

        .pad-btn.pressed {
            background-color: #b0b0b0;
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.3);
            transform: translateY(1px);
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .action-buttons .pad-btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            font-size: 22px;
        }

        .action-buttons .b {
            margin-top: 40px;
        }
    </style>

</head>
<body>
    <div class="screen-container">
    </div>
    <div class="touch-controls">
        <div class="dpad">
            <div class="pad-btn up" data-key="ArrowUp">&#9650;</div>
            <div class="pad-btn left" data-key="ArrowLeft">&#9664;</div>
            <div class="pad-btn right" data-key="ArrowRight">&#9654;</div>
            <div class="pad-btn down" data-key="ArrowDown">&#9660;</div>
        </div>
        <div class="action-buttons">
            <div class="pad-btn b" data-key="1">B</div>
            <div class="pad-btn a" data-key="0">A</div>
        </div>
    </div>
    <br>
    <div class="description">
        <table>
            <tr><th>up:</th><td><span class="key">ArrowUp</span> <span class="key">e</span> <span class="key">k</span></td></tr>
            <tr><th>down:</th><td><span class="key">ArrowDown</span> <span class="key">d</span> <span class="key">j</span></td></tr>
            <tr><th>left:</th><td><span class="key">ArrowLeft</span> <span class="key">s</span> <span class="key">h</span></td></tr>
            <tr><th>right:</th><td><span class="key">ArrowRight</span> <span class="key">f</span> <span class="key">l</span></td></tr>
            <tr><th>Key0:</th><td><span class="key">z</span> <span class="key">n</span> <span class="key">0</span> <span class="key">Space</span> <span class="key">Enter</span> <span class="key">Tap</span></td></tr>
            <tr><th>Key1:</th><td><span class="key">x</span> <span class="key">m</span> <span class="key">1</span></td></tr>
            <tr><th>Key2:</th><td><span class="key">c</span> <span class="key">,</span> <span class="key">2</span></td></tr>
            <tr><th>Key3:</th><td><span class="key">v</span> <span class="key">.</span> <span class="key">3</span></td></tr>
        </table>
    </div>
    <br>
    <a href="https://github.com/sago35/koebiten" target="_blank" class="github-link">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.32c-2.22.48-2.69-1.07-2.69-1.07-.36-.92-.88-1.16-.88-1.16-.72-.49.06-.48.06-.48.8.06 1.23.83 1.23.83.7 1.21 1.84.86 2.28.66.07-.5.27-.86.49-1.06-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.7 7.7 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.28.24.53.72.53 1.45v2.14c0 .21.14.46.55.38A8 8 0 0 0 8 0z"/>
        </svg>
    </a>
    <br>
    <p class="gopher-credit">The Go gopher was designed by Renée French.</p>
</body>
</html>
